# MESI multi-core cache simulator - default configuration
# Lines starting with # are comments. CLI flags override these values.

ram_size=1048576
cache_size=32768
line_size=64
associativity=4
num_cores=4

trace_file=traces/sample_trace.txt
output_file=trace.output
stats_file=stats.txt

# Cost model for the estimated AMAT (Average Memory Access Time) report.
hit_time_cycles=1
miss_penalty_cycles=50

verbose=false
